services:
  - type: web
    name: ai-attendance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements-cloud.txt && pip install --no-deps face_recognition==1.3.0"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "https://hackthon-project-chi.vercel.app"
      - key: FACE_MATCH_THRESHOLD
        value: "0.70"
      - key: FACE_DISTANCE_TOLERANCE
        value: "0.6"
      - key: QR_EXPIRY_SECONDS
        value: "120"
      - key: TEACHER_SIGNUP_CODE
        sync: false
      - key: ADMIN_SIGNUP_CODE
        sync: false
