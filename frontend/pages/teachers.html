<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teachers — Attendify</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="app-sidebar"></div>
  <div class="flex-1 min-w-0">
    <div id="app-topbar"></div>

    <main class="max-w-7xl mx-auto p-4 sm:p-6">
      <div class="card p-5">
        <div class="flex flex-wrap items-center gap-3 justify-between mb-4">
          <div class="flex flex-wrap gap-2">
            <input id="search" class="input !w-56" placeholder="Search employee ID..." />
            <select id="dept-filter" class="input !w-auto"><option value="">All Departments</option></select>
          </div>
          <a href="register.html" class="btn btn-primary">+ Add Teacher</a>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left" style="color:var(--text-muted)">
              <th class="py-2 px-3">Name</th><th class="py-2 px-3">Employee ID</th><th class="py-2 px-3">Department</th>
              <th class="py-2 px-3">Designation</th><th class="py-2 px-3">Sections</th><th class="py-2 px-3">Status</th><th class="py-2 px-3"></th>
            </tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div id="pagination" class="flex items-center justify-between mt-4 text-sm"></div>
      </div>
    </main>
  </div>
</div>

<div id="edit-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center px-4">
  <div class="modal-backdrop absolute inset-0" onclick="UI.closeModal('edit-modal')"></div>
  <div class="card glass relative z-10 w-full max-w-md p-6">
    <h3 class="font-bold text-lg mb-4">Edit Teacher</h3>
    <input type="hidden" id="edit-id" />
    <label class="text-sm font-semibold mb-1 block">Full Name</label>
    <input id="edit-name" class="input mb-3" />
    <label class="text-sm font-semibold mb-1 block">Designation</label>
    <input id="edit-designation" class="input mb-3" placeholder="Assistant Professor" />
    <label class="text-sm font-semibold mb-1 block">Assigned Sections (comma separated)</label>
    <input id="edit-sections" class="input mb-3" placeholder="A, B" />
    <label class="text-sm font-semibold mb-1 block">Primary Subject</label>
    <input id="edit-subject" class="input mb-3" placeholder="Data Structures" />
    <label class="text-sm font-semibold mb-1 block">Lecture Timing</label>
    <input id="edit-lecture-timing" class="input mb-3" placeholder="Morning · 9:00–12:00" />
    <label class="text-sm font-semibold mb-1 block">Punch-In Deadline</label>
    <input id="edit-punch-deadline" type="time" class="input mb-5" />
    <div class="flex gap-3">
      <button class="btn btn-secondary flex-1" onclick="UI.closeModal('edit-modal')">Cancel</button>
      <button id="save-edit" class="btn btn-primary flex-1">Save Changes</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/session-alerts.js"></script>
<script>
  let page = 1;
  const pageSize = 12;

  async function loadTeachers() {
    const params = new URLSearchParams({ page, page_size: pageSize });
    const search = document.getElementById("search").value.trim();
    const dept = document.getElementById("dept-filter").value;
    if (search) params.set("search", search);
    if (dept) params.set("department_id", dept);

    document.getElementById("table-body").innerHTML = UI.skeletonRows(6, 7);
    const res = await api.get(`/teachers?${params.toString()}`);
    const rows = res.data || [];

    document.getElementById("table-body").innerHTML =
      rows
        .map(
          (t) => `<tr class="table-row border-t" style="border-color:var(--border)">
        <td class="py-2 px-3 font-medium">${t.profiles?.full_name || "—"}</td>
        <td class="py-2 px-3">${t.employee_id}</td>
        <td class="py-2 px-3">${t.departments?.name || "—"}</td>
        <td class="py-2 px-3">${t.designation || "—"}</td>
        <td class="py-2 px-3">${(t.assigned_sections || []).join(", ") || "—"}</td>
        <td class="py-2 px-3">${t.profiles?.is_active ? UI.statusBadge("approved") : UI.statusBadge("rejected")}</td>
        <td class="py-2 px-3 text-right">
          <button class="text-blue-500 font-semibold text-xs mr-3" onclick='openEdit(${JSON.stringify(t).replace(/'/g, "&apos;")})'>Edit</button>
          <button class="text-red-500 font-semibold text-xs" onclick="deleteTeacher('${t.id}')">Delete</button>
        </td>
      </tr>`
        )
        .join("") || `<tr><td colspan="7" class="py-8 text-center" style="color:var(--text-muted)">No teachers found.</td></tr>`;

    renderPagination(res.total);
  }

  function renderPagination(total) {
    const pages = Math.max(Math.ceil(total / pageSize), 1);
    document.getElementById("pagination").innerHTML = `
      <span style="color:var(--text-muted)">Page ${page} of ${pages} · ${total} total</span>
      <div class="flex gap-2">
        <button class="btn btn-secondary !px-3 !py-1.5" ${page <= 1 ? "disabled" : ""} onclick="changePage(-1)">Prev</button>
        <button class="btn btn-secondary !px-3 !py-1.5" ${page >= pages ? "disabled" : ""} onclick="changePage(1)">Next</button>
      </div>`;
  }
  function changePage(delta) { page += delta; loadTeachers(); }

  function openEdit(t) {
    document.getElementById("edit-id").value = t.id;
    document.getElementById("edit-name").value = t.profiles?.full_name || "";
    document.getElementById("edit-designation").value = t.designation || "";
    document.getElementById("edit-sections").value = (t.assigned_sections || []).join(", ");
    document.getElementById("edit-subject").value = t.primary_subject || "";
    document.getElementById("edit-lecture-timing").value = t.lecture_timing || "";
    document.getElementById("edit-punch-deadline").value = (t.punch_in_deadline || "07:00:00").slice(0, 5);
    UI.openModal("edit-modal");
  }

  async function deleteTeacher(id) {
    if (!confirm("Delete this teacher permanently? This cannot be undone.")) return;
    await api.del(`/teachers/${id}`);
    UI.toast("Teacher deleted", "success");
    loadTeachers();
  }

  document.getElementById("save-edit").addEventListener("click", async () => {
    const id = document.getElementById("edit-id").value;
    await api.put(`/teachers/${id}`, {
      full_name: document.getElementById("edit-name").value,
      designation: document.getElementById("edit-designation").value,
      assigned_sections: document.getElementById("edit-sections").value.split(",").map((s) => s.trim()).filter(Boolean),
      primary_subject: document.getElementById("edit-subject").value,
      lecture_timing: document.getElementById("edit-lecture-timing").value,
      punch_in_deadline: document.getElementById("edit-punch-deadline").value ? document.getElementById("edit-punch-deadline").value + ":00" : undefined,
    });
    UI.toast("Teacher updated", "success");
    UI.closeModal("edit-modal");
    loadTeachers();
  });

  ["search", "dept-filter"].forEach((id) =>
    document.getElementById(id).addEventListener("input", () => { page = 1; loadTeachers(); })
  );

  (async () => {
    const { role } = await renderLayout("teachers");
    if (!role) return;

    const { data } = await sb.from("departments").select("id, name").order("name");
    const select = document.getElementById("dept-filter");
    (data || []).forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.name;
      select.appendChild(opt);
    });

    loadTeachers();
  })();
</script>
</body>
</html>
