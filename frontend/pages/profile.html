<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — Attendify</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='24' y2='24'%3E%3Cstop stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cg transform='translate(6,6) scale(0.5)' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2'/%3E%3Ccircle cx='9' cy='7' r='4'/%3E%3Cpath d='M17 11l2 2 4-4'/%3E%3C/g%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="app-sidebar"></div>
  <div class="flex-1 min-w-0">
    <div id="app-topbar"></div>

    <main class="max-w-3xl mx-auto p-4 sm:p-6 space-y-5">
      <div class="card p-6">
        <div class="flex items-center gap-4 mb-6">
          <div id="avatar" class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-blue-300 flex items-center justify-center text-white font-bold text-2xl">U</div>
          <div>
            <h2 id="profile-name" class="font-bold text-lg">—</h2>
            <p id="profile-role" class="text-sm capitalize" style="color:var(--text-muted)">—</p>
          </div>
        </div>
        <form id="profile-form" class="grid sm:grid-cols-2 gap-4">
          <div><label class="text-sm font-semibold mb-1 block">Full Name</label><input id="full_name" class="input" /></div>
          <div><label class="text-sm font-semibold mb-1 block">Email</label><input id="email" class="input" disabled /></div>
          <div><label class="text-sm font-semibold mb-1 block">Phone</label><input id="phone" class="input" /></div>
          <div class="sm:col-span-2"><button type="submit" class="btn btn-primary">Save Profile</button></div>
        </form>
      </div>

      <div id="face-card" class="hidden card p-6">
        <h3 class="font-bold mb-1">Face Registration</h3>
        <p id="face-card-subtitle" class="text-sm mb-4" style="color:var(--text-muted)">Start the camera and follow the prompts — 5 photos capture automatically.</p>
        <div class="relative rounded-2xl overflow-hidden bg-black aspect-[3/4] sm:aspect-video max-w-lg">
          <video id="video" autoplay playsinline class="w-full h-full object-cover mirror-video"></video>
          <canvas id="canvas" class="hidden"></canvas>
          <div id="capture-flash" class="absolute inset-0 bg-white opacity-0 pointer-events-none"></div>
          <div id="oval-guide" class="face-oval-guide hidden">
            <div class="oval"></div>
            <p id="guide-instruction" class="face-guide-instruction">Get ready...</p>
            <p id="guide-countdown" class="face-guide-countdown"></p>
          </div>
        </div>
        <div class="flex justify-center gap-2 my-4 max-w-lg">
          <div id="dot-capture-1" class="w-3 h-3 rounded-full" style="background:var(--border)"></div>
          <div id="dot-capture-2" class="w-3 h-3 rounded-full" style="background:var(--border)"></div>
          <div id="dot-capture-3" class="w-3 h-3 rounded-full" style="background:var(--border)"></div>
          <div id="dot-capture-4" class="w-3 h-3 rounded-full" style="background:var(--border)"></div>
          <div id="dot-capture-5" class="w-3 h-3 rounded-full" style="background:var(--border)"></div>
        </div>
        <div class="flex items-center gap-3 mt-4">
          <button id="camera-btn" class="btn btn-secondary">Start Camera</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/session-alerts.js"></script>
<script src="../assets/js/guided-face-capture.js"></script>
<script>
  let captures = [];
  let myProfile;

  document.getElementById("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    await sb.from("profiles").update({
      full_name: document.getElementById("full_name").value,
      phone: document.getElementById("phone").value,
    }).eq("id", myProfile.id);
    UI.toast("Profile updated", "success");
    myProfile.full_name = document.getElementById("full_name").value;
    localStorage.setItem("profile", JSON.stringify(myProfile));
  });

  let enrollCancelled = false;

  document.getElementById("camera-btn").addEventListener("click", async () => {
    const video = document.getElementById("video");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      video.srcObject = stream;
      document.getElementById("camera-btn").classList.add("hidden");
      document.getElementById("oval-guide").classList.remove("hidden");
      document.getElementById("face-card-subtitle").textContent = "Follow the prompts — each pose captures automatically.";
      runGuidedCapture();
    } catch (_) {
      UI.toast("Camera access denied", "error");
    }
  });

  async function runGuidedCapture() {
    const dotEls = [1, 2, 3, 4, 5].map((n) => document.getElementById(`dot-capture-${n}`));
    captures = await GuidedFaceCapture.run({
      video: document.getElementById("video"),
      canvas: document.getElementById("canvas"),
      instructionEl: document.getElementById("guide-instruction"),
      countdownEl: document.getElementById("guide-countdown"),
      dotEls,
      isCancelled: () => enrollCancelled,
      onCapture: () => {
        const flash = document.getElementById("capture-flash");
        flash.style.transition = "none";
        flash.style.opacity = "0.85";
        requestAnimationFrame(() => {
          flash.style.transition = "opacity .3s ease";
          flash.style.opacity = "0";
        });
      },
    });

    if (enrollCancelled || captures.length < 5) return;

    document.getElementById("oval-guide").classList.add("hidden");
    document.getElementById("face-card-subtitle").textContent = "Registering your face...";
    try {
      const res = await api.post("/face/enroll", { owner_id: myProfile.id, images_base64: captures });
      UI.toast(res.message, "success");
      document.getElementById("face-card-subtitle").textContent = "Face registered! You can re-capture anytime by starting the camera again.";
      document.getElementById("camera-btn").classList.remove("hidden");
      document.getElementById("camera-btn").textContent = "Re-capture Face";
    } catch (_) {
      UI.toast("Face registration failed — try again.", "error");
      document.getElementById("camera-btn").classList.remove("hidden");
    }
  }

  (async () => {
    const { profile, role } = await renderLayout("profile");
    if (!profile) return;
    myProfile = profile;

    document.getElementById("profile-name").textContent = profile.full_name;
    document.getElementById("profile-role").textContent = profile.role;
    document.getElementById("avatar").textContent = profile.full_name[0].toUpperCase();
    document.getElementById("full_name").value = profile.full_name;
    document.getElementById("email").value = profile.email;
    document.getElementById("phone").value = profile.phone || "";

    if (role === "student" || role === "teacher") document.getElementById("face-card").classList.remove("hidden");
  })();
</script>
</body>
</html>
