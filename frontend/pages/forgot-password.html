<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Attendify</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='24' y2='24'%3E%3Cstop stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cg transform='translate(6,6) scale(0.5)' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2'/%3E%3Ccircle cx='9' cy='7' r='4'/%3E%3Cpath d='M17 11l2 2 4-4'/%3E%3C/g%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="min-h-screen flex items-center justify-center relative px-4 overflow-x-hidden">
<div class="hero-glow"></div>
<div class="relative z-10 w-full max-w-md">
  <div class="text-center mb-8">
    <a href="../index.html" class="inline-flex items-center gap-2">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-blue-400 flex items-center justify-center text-white font-bold"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path stroke-linecap="round" stroke-linejoin="round" d="M17 11l2 2 4-4"/></svg></div>
      <span class="font-extrabold text-xl tracking-tight"><span class="gradient-text">Attendify</span></span>
    </a>
  </div>

  <form id="step-email" class="card p-8 fade-in">
    <h1 class="text-2xl font-extrabold mb-1">Forgot password?</h1>
    <p class="text-sm mb-6" style="color:var(--text-muted)">Enter your email — works for student, teacher, and admin accounts. We'll send a 6-digit code.</p>
    <label class="text-sm font-semibold mb-1 block">Email</label>
    <input type="email" id="email" required class="input mb-6" placeholder="you@college.edu" />
    <button type="submit" id="send-otp-btn" class="btn btn-primary w-full">Send Verification Code</button>
    <p class="text-sm text-center mt-6" style="color:var(--text-muted)">
      Remembered it? <a href="login.html" class="font-semibold text-blue-500">Back to login</a>
    </p>
  </form>

  <form id="step-otp" class="hidden card p-8 fade-in">
    <h1 class="text-2xl font-extrabold mb-1">Enter code</h1>
    <p class="text-sm mb-6" style="color:var(--text-muted)">We sent a 6-digit code to <span id="otp-email-display" class="font-semibold"></span>.</p>

    <label class="text-sm font-semibold mb-1 block">Verification Code</label>
    <input type="text" id="otp" required maxlength="6" pattern="\d{6}" inputmode="numeric" class="input mb-4 text-center tracking-[0.5em] font-bold text-lg" placeholder="000000" />

    <label class="text-sm font-semibold mb-1 block">New Password</label>
    <input type="password" id="new_password" required minlength="8" class="input mb-6" placeholder="Minimum 8 characters" />

    <button type="submit" id="reset-btn" class="btn btn-primary w-full">Reset Password</button>
    <button type="button" id="resend-btn" class="btn btn-secondary w-full mt-3">Resend Code</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/password-toggle.js"></script>
<script>
  let currentEmail = "";

  async function apiFetch(path, payload) {
    let res;
    try {
      res = await fetch(`${window.APP_CONFIG.API_BASE_URL}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    } catch (networkErr) {
      throw new Error("Can't reach the server — it may be waking up from sleep (free-tier hosting). Please wait ~20 seconds and try again.");
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(UI.formatError(body.detail, "Request failed"));
    return body;
  }

  async function requestOtp(email) {
    return apiFetch("/auth/otp/request", { email });
  }

  document.getElementById("step-email").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("send-otp-btn");
    btn.disabled = true;
    btn.textContent = "Sending...";
    try {
      currentEmail = document.getElementById("email").value.trim();
      await requestOtp(currentEmail);
      document.getElementById("otp-email-display").textContent = currentEmail;
      document.getElementById("step-email").classList.add("hidden");
      document.getElementById("step-otp").classList.remove("hidden");
      UI.toast("Verification code sent — check your email", "success");
    } catch (err) {
      UI.toast(err.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Send Verification Code";
    }
  });

  document.getElementById("resend-btn").addEventListener("click", async () => {
    try {
      await requestOtp(currentEmail);
      UI.toast("Code resent", "success");
    } catch (err) {
      UI.toast(err.message, "error");
    }
  });

  document.getElementById("step-otp").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("reset-btn");
    btn.disabled = true;
    btn.textContent = "Resetting...";
    try {
      await apiFetch("/auth/otp/verify-reset", {
        email: currentEmail,
        otp: document.getElementById("otp").value.trim(),
        new_password: document.getElementById("new_password").value,
      });
      UI.toast("Password reset! Redirecting to login...", "success");
      setTimeout(() => (window.location.href = "login.html"), 1200);
    } catch (err) {
      UI.toast(err.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Reset Password";
    }
  });
</script>
</body>
</html>
