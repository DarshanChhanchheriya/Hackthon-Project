<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports — Attendify</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='24' y2='24'%3E%3Cstop stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cg transform='translate(6,6) scale(0.5)' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2'/%3E%3Ccircle cx='9' cy='7' r='4'/%3E%3Cpath d='M17 11l2 2 4-4'/%3E%3C/g%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="app-sidebar"></div>
  <div class="flex-1 min-w-0">
    <div id="app-topbar"></div>

    <main class="max-w-4xl mx-auto p-4 sm:p-6">
      <div class="card p-6">
        <h2 class="font-bold text-lg mb-1">Generate Attendance Report</h2>
        <p class="text-sm mb-6" style="color:var(--text-muted)">Choose a period, optional department filter, and export format.</p>

        <div class="grid sm:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="text-sm font-semibold mb-1 block">Period</label>
            <select id="period" class="input">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly" selected>Monthly</option>
              <option value="semester">Semester</option>
            </select>
          </div>
          <div>
            <label class="text-sm font-semibold mb-1 block">Department</label>
            <select id="department_id" class="input"><option value="">All Departments</option></select>
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4 mb-6">
          <div><label class="text-sm font-semibold mb-1 block">Custom Start (optional)</label><input type="date" id="start_date" class="input" /></div>
          <div><label class="text-sm font-semibold mb-1 block">Custom End (optional)</label><input type="date" id="end_date" class="input" /></div>
        </div>

        <label class="text-sm font-semibold mb-2 block">Export Format</label>
        <div class="grid grid-cols-3 gap-3 mb-6">
          <button class="btn btn-secondary format-btn" data-format="pdf">📄 PDF</button>
          <button class="btn btn-secondary format-btn" data-format="excel">📊 Excel</button>
          <button class="btn btn-secondary format-btn" data-format="csv">🧾 CSV</button>
        </div>

        <button id="generate-btn" class="btn btn-primary w-full" data-format="pdf">Generate &amp; Download</button>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/session-alerts.js"></script>
<script>
  let selectedFormat = "pdf";
  document.querySelectorAll(".format-btn").forEach((btn) =>
    btn.addEventListener("click", () => {
      document.querySelectorAll(".format-btn").forEach((b) => b.classList.remove("btn-primary"));
      btn.classList.add("btn-primary");
      selectedFormat = btn.dataset.format;
    })
  );

  document.getElementById("generate-btn").addEventListener("click", async () => {
    const btn = document.getElementById("generate-btn");
    btn.disabled = true;
    btn.textContent = "Generating...";
    try {
      const payload = {
        period: document.getElementById("period").value,
        department_id: document.getElementById("department_id").value || null,
        start_date: document.getElementById("start_date").value || null,
        end_date: document.getElementById("end_date").value || null,
        export: selectedFormat,
      };
      const ext = selectedFormat === "excel" ? "xlsx" : selectedFormat;
      await api.downloadFile("/reports/generate", payload, `attendance-report.${ext}`);
      UI.toast("Report downloaded", "success");
    } catch (_) {
      /* toast already shown */
    } finally {
      btn.disabled = false;
      btn.textContent = "Generate & Download";
    }
  });

  (async () => {
    const { role } = await renderLayout("reports");
    if (!role) return;

    const { data } = await sb.from("departments").select("id, name").order("name");
    const select = document.getElementById("department_id");
    (data || []).forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.name;
      select.appendChild(opt);
    });

    document.querySelector('.format-btn[data-format="pdf"]').classList.add("btn-primary");
  })();
</script>
</body>
</html>
