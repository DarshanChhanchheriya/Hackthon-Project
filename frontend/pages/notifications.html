<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications — Attendify</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='24' y2='24'%3E%3Cstop stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cg transform='translate(6,6) scale(0.5)' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2'/%3E%3Ccircle cx='9' cy='7' r='4'/%3E%3Cpath d='M17 11l2 2 4-4'/%3E%3C/g%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="app-sidebar"></div>
  <div class="flex-1 min-w-0">
    <div id="app-topbar"></div>

    <main class="max-w-3xl mx-auto p-4 sm:p-6">
      <div class="card p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold">Notifications</h3>
          <button id="mark-all-btn" class="text-sm font-semibold text-blue-500">Mark all as read</button>
        </div>
        <div id="list" class="space-y-2"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/session-alerts.js"></script>
<script>
  const TYPE_ICON = { success: "✅", warning: "⚠️", error: "❌", info: "ℹ️" };

  async function loadNotifications() {
    const list = await api.get("/notifications");
    document.getElementById("list").innerHTML =
      list
        .map((n) => {
          const isSession = n.title === "Attendance session started";
          return `<div class="card p-4 flex items-start gap-3 ${n.is_read ? "" : "border-l-4 border-blue-500"} ${isSession ? "cursor-pointer" : ""}" ${isSession ? `onclick="openCheckinFromNotification('${n.id}')"` : ""}>
        <span class="text-xl">${TYPE_ICON[n.type] || "ℹ️"}</span>
        <div class="flex-1">
          <p class="font-semibold text-sm">${n.title}</p>
          <p class="text-sm" style="color:var(--text-muted)">${n.message}</p>
          <p class="text-xs mt-1" style="color:var(--text-muted)">${UI.formatDate(n.created_at)} · ${UI.formatTime(n.created_at)}</p>
          ${isSession ? `<span class="text-xs font-semibold text-blue-500 mt-1 inline-block">Tap to check in →</span>` : ""}
        </div>
        ${!n.is_read ? `<button class="text-xs font-semibold text-blue-500" onclick="event.stopPropagation(); markRead('${n.id}')">Mark read</button>` : ""}
      </div>`;
        })
        .join("") || `<p class="text-sm text-center py-10" style="color:var(--text-muted)">You're all caught up 🎉</p>`;
  }

  async function markRead(id) {
    await api.put(`/notifications/${id}/read`, {});
    loadNotifications();
  }

  async function openCheckinFromNotification(notificationId) {
    const session = await SessionAlerts.findActiveSessionForMe();
    if (session) {
      SessionAlerts.openModal(session.id);
    } else {
      UI.toast("That session isn't active anymore", "warning");
    }
    markRead(notificationId);
  }

  document.getElementById("mark-all-btn").addEventListener("click", async () => {
    await api.put("/notifications/read-all", {});
    loadNotifications();
  });

  (async () => {
    const { role } = await renderLayout("notifications");
    if (!role) return;
    loadNotifications();
  })();
</script>
</body>
</html>
