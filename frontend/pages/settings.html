<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — Attendify</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='24' y2='24'%3E%3Cstop stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cg transform='translate(6,6) scale(0.5)' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2'/%3E%3Ccircle cx='9' cy='7' r='4'/%3E%3Cpath d='M17 11l2 2 4-4'/%3E%3C/g%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="app-sidebar"></div>
  <div class="flex-1 min-w-0">
    <div id="app-topbar"></div>

    <main class="max-w-3xl mx-auto p-4 sm:p-6 space-y-5">
      <div class="card p-6">
        <h3 class="font-bold mb-4">Appearance</h3>
        <div class="flex items-center justify-between">
          <div>
            <p class="font-semibold text-sm">Dark Mode</p>
            <p class="text-xs" style="color:var(--text-muted)">Switch between light and dark themes.</p>
          </div>
          <button onclick="toggleTheme()" class="btn btn-secondary">Toggle <span data-theme-icon class="inline-flex"></span></button>
        </div>
      </div>

      <div class="card p-6">
        <h3 class="font-bold mb-4">Security</h3>
        <form id="password-form" class="grid gap-4 max-w-sm">
          <div><label class="text-sm font-semibold mb-1 block">New Password</label><input type="password" id="new_password" minlength="8" required class="input" /></div>
          <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
      </div>

      <div id="admin-settings" class="hidden card p-6">
        <h3 class="font-bold mb-4">System Settings</h3>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="text-sm font-semibold mb-1 block">Face Match Threshold</label><input class="input" value="90%" disabled /></div>
          <div><label class="text-sm font-semibold mb-1 block">QR Expiry</label><input class="input" value="120 seconds" disabled /></div>
        </div>
        <p class="text-xs mt-3" style="color:var(--text-muted)">Configured via backend environment variables (FACE_MATCH_THRESHOLD, QR_EXPIRY_SECONDS).</p>
      </div>

      <div class="card p-6">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style="background:var(--accent-soft); color:var(--accent)">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </div>
          <div>
            <h3 class="font-bold">Session</h3>
            <p class="text-xs" style="color:var(--text-muted)">Sign out of your account on this device.</p>
          </div>
        </div>
        <button onclick="window.Auth.signOut()" class="btn btn-secondary">Sign Out</button>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/session-alerts.js"></script>
<script src="../assets/js/password-toggle.js"></script>
<script>
  document.getElementById("password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: document.getElementById("new_password").value });
    if (error) return UI.toast(error.message, "error");
    UI.toast("Password updated successfully", "success");
    e.target.reset();
  });

  (async () => {
    const { role } = await renderLayout("settings");
    if (!role) return;
    if (role === "admin") document.getElementById("admin-settings").classList.remove("hidden");
  })();
</script>
</body>
</html>
